<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern To-Do Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(to right, #c084fc, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .date-str {
      font-size: 13px;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin: 12px 0 24px 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-wrapper input::placeholder { color: var(--text-muted); }

    .input-wrapper input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
    }

    .add-btn {
      padding: 0 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .filter-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .task-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      margin-bottom: 10px;
      transition: all 0.25s ease;
    }

    .task-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 1;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .task-item.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox i {
      font-size: 11px;
      color: white;
      display: none;
    }

    .task-item.completed .checkbox i { display: block; }

    .task-text {
      font-size: 14px;
      color: var(--text-main);
      word-break: break-word;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      font-size: 14px;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 30px 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .empty-state i {
      font-size: 32px;
      margin-bottom: 10px;
      opacity: 0.4;
      display: block;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="header-top">
      <h1>My Workspace</h1>
      <span class="date-str" id="dateStr">Today</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="input-wrapper">
    <input type="text" id="taskInput" placeholder="Add a new task..." onkeydown="if(event.key === 'Enter') addTask()"/>
    <button class="add-btn" onclick="addTask()"><i class="fa-solid fa-plus"></i></button>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('active', this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
  </div>

  <ul class="task-list" id="taskList"></ul>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('my_todos')) || [];
  let currentFilter = 'all';

  document.getElementById('dateStr').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  function saveAndRender() {
    localStorage.setItem('my_todos', JSON.stringify(tasks));
    renderTasks();
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;

    tasks.unshift({ id: Date.now(), text: text, completed: false });
    input.value = '';
    saveAndRender();
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveAndRender();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveAndRender();
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTasks();
  }

  function renderTasks() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';

    const filtered = tasks.filter(t => {
      if (currentFilter === 'active') return !t.completed;
      if (currentFilter === 'completed') return t.completed;
      return true;
    });

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <i class="fa-regular fa-clipboard"></i>
          <p>${tasks.length === 0 ? "No tasks yet. Create one!" : "No tasks found in this filter."}</p>
        </div>`;
    } else {
      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="task-left" onclick="toggleTask(${task.id})">
            <div class="checkbox"><i class="fa-solid fa-check"></i></div>
            <span class="task-text">${escapeHtml(task.text)}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask(${task.id})">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        list.appendChild(li);
      });
    }

    const completedCount = tasks.filter(t => t.completed).length;
    const progressPercent = tasks.length ? (completedCount / tasks.length) * 100 : 0;
    document.getElementById('progressFill').style.width = `${progressPercent}%`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  renderTasks();
</script>

</body>
</html>
